name: Update test counts

# Counts the automated tests (unit + Grafana k6 load tests) in every public repo,
# publishes them in stats.json (read by the portfolio page) and writes them into
# both CVs, re-rendering the PDFs when a number changes.
on:
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count tests in every repo
        id: count
        run: python3 tools/count_tests.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the counts into the CVs
        id: cv
        run: python3 tools/update_cv_tests.py

      - name: Render CV PDFs
        if: steps.cv.outputs.cv_changed == 'true'
        run: |
          for L in EN AR; do
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --run-all-compositor-stages-before-draw --virtual-time-budget=15000 \
              --print-to-pdf="cv/Ahmed-Hassan-CV-$L.pdf" "file://$PWD/cv-src/Ahmed-Hassan-CV-$L.html"
          done
          ls -la cv

      - name: Commit and publish
        if: steps.count.outputs.changed == 'true' || steps.cv.outputs.cv_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json cv cv-src
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Stats: update test counts"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
